name: Grok Automated CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: cicd-grok-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write
  id-token: write

env:
  NODE_VERSION: "20"

jobs:
  build-and-test:
    name: Checkout, test, static analysis
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.gate.outputs.tests_passed }}
      summary: ${{ steps.summarize.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static analysis (TypeScript)
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log

      - name: Static analysis (ESLint, non-blocking)
        id: lint
        continue-on-error: true
        run: |
          if npx eslint --version >/dev/null 2>&1; then
            npx eslint . --ext .ts,.tsx --max-warnings 0 2>&1 | tee lint.log || true
          else
            echo "eslint is not installed; typecheck is the static gate" | tee lint.log
          fi

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log

      - name: Install Playwright browser
        if: steps.build.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Run tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npx playwright test --reporter=list,junit 2>&1 | tee test.log
        env:
          CI: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cicd-logs-${{ github.sha }}
          path: |
            typecheck.log
            lint.log
            build.log
            test.log
            dist/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize test results
        id: summarize
        if: always()
        run: |
          python3 - << 'PY'
          from pathlib import Path
          def tail(name, n=40):
              p = Path(name)
              if not p.exists():
                  return f"{name}: not produced"
              lines = p.read_text(errors="replace").splitlines()
              bad = [ln for ln in lines if any(k in ln.lower() for k in ("error", "failed", "fail", "✗"))]
              body = "\n".join((bad or lines)[-n:])
              return body or "(empty)"
          passed = "${{ steps.typecheck.outcome }}" == "success" and "${{ steps.build.outcome }}" == "success" and "${{ steps.tests.outcome }}" == "success"
          summary = f"""## Grok CI summary
          **Repo:** {"${{ github.repository }}"}
          **Event:** {"${{ github.event_name }}"} on `{"${{ github.ref_name }}"}`
          **SHA:** `{"${{ github.sha }}"}`
          **Author:** @{"${{ github.actor }}"}

          | Gate | Result |
          | --- | --- |
          | Typecheck | {"${{ steps.typecheck.outcome }}"} |
          | ESLint | {"${{ steps.lint.outcome }}"} (non-blocking) |
          | Vite build | {"${{ steps.build.outcome }}"} |
          | Playwright | {"${{ steps.tests.outcome }}"} |
          | Overall | {"PASS" if passed else "FAIL"} |

          ### Error highlights
          ```
          {tail("typecheck.log")}
          ---
          {tail("build.log")}
          ---
          {tail("test.log")}
          ```

          ### Actionable review feedback
          - Keep new code under `src/` only. Do not revive root `pages/` or `components/`.
          - Typecheck is the merge gate. Fix every `error TS` before requesting review.
          - Playwright must stay green in CI (`CI=true`). Update snapshots only on purpose.
          - Do not commit Gemini keys. Live AI paths need `GEMINI_API_KEY` as a secret, not a source constant.
          """
          Path("ci-summary.md").write_text(summary)
          delim = "EOF_SUMMARY"
          with open("$GITHUB_OUTPUT", "a") as fh:
              fh.write(f"tests_passed={'true' if passed else 'false'}\n")
              fh.write(f"summary<<{delim}\n{summary}\n{delim}\n")
          Path("$GITHUB_STEP_SUMMARY").write_text(summary)
          PY

      - name: Record gate
        id: gate
        if: always()
        run: echo "tests_passed=${{ steps.summarize.outputs.tests_passed }}" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          {
            echo "@$AUTHOR"
            echo
            cat ci-summary.md
            echo
            echo "Next step: address the highlighted errors, then re-request review."
          } > pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file pr-comment.md

  deploy:
    name: Deploy to production
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-and-test.outputs.tests_passed == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy to Production
        id: deploy
        run: python3 scripts/deploy_to_production.py
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Rollback on failure
        if: failure()
        run: python3 scripts/rollback_deployment.py
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify maintainers
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ steps.deploy.outcome }}"
          {
            echo "## Production deploy $STATUS"
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo "Actor: @${{ github.actor }}"
            echo
            echo "### deploy_log.txt"
            echo '```'
            tail -n 80 deploy_log.txt 2>/dev/null || echo "no deploy log"
            echo '```'
            if [ "$STATUS" != "success" ]; then
              echo
              echo "Remediation: confirm FIREBASE_TOKEN and FIREBASE_PROJECT_ID, rerun the failed job, or execute scripts/rollback_deployment.py."
              echo "### rollback_log.txt"
              echo '```'
              tail -n 40 rollback_log.txt 2>/dev/null || true
              echo '```'
            fi
          } > deploy-comment.md
          gh issue comment 1 --repo "${{ github.repository }}" --body-file deploy-comment.md || echo "issue #1 missing; skipping issue comment"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            python3 - << 'PY'
            import json, os, urllib.request
            text = open("deploy-comment.md", errors="replace").read()[:2500]
            req = urllib.request.Request(
                os.environ["SLACK_WEBHOOK_URL"],
                data=json.dumps({"text": text}).encode(),
                headers={"Content-Type": "application/json"},
            )
            urllib.request.urlopen(req, timeout=15).read()
            PY
          fi
