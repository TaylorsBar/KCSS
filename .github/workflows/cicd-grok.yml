name: Grok Automated CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write
  id-token: write

env:
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: Checkout • Install • Typecheck • Build • Lint
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.gate.outputs.tests_passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            echo "::warning::No package-lock.json — falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: TypeScript type-check
        id: typecheck
        run: npx tsc --noEmit

      - name: Static analysis (ESLint if present)
        id: lint
        run: |
          if [ -f eslint.config.js ] || [ -f .eslintrc.js ] || [ -f .eslintrc.cjs ] || [ -f .eslintrc.json ]; then
            npx eslint . --ext .ts,.tsx --max-warnings 50 || echo "Lint warnings present"
          else
            echo "No ESLint config — skipping static analysis"
          fi

      - name: Production build
        id: build
        run: npm run build

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kcss-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Gate output
        id: gate
        if: always()
        run: |
          if [ "${{ steps.typecheck.outcome }}" = "success" ] && [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "tests_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Grok summary
        if: always()
        run: |
          {
            echo "## Grok CI Summary — TaylorsBar/KCSS"
            echo
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Event:** ${{ github.event_name }}"
            echo
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| TypeScript | ${{ steps.typecheck.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Vite Build | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Playwright E2E
    needs: build-and-test
    if: needs.build-and-test.outputs.tests_passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --prefer-offline --no-audit; else npm install --no-audit --no-fund; fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        id: e2e
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  pr-comment:
    name: Post PR summary
    needs: [build-and-test, e2e]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.build-and-test.outputs.tests_passed }}' === 'true';
            const author = context.payload.pull_request.user.login;
            const body = `## Grok CI/CD summary

@${author} — pipeline result for \`${{ github.sha }}\`

| Check | Result |
|-------|--------|
| Typecheck + build | ${passed ? '✅' : '❌'} |
| Playwright E2E | ${passed ? '✅ (see e2e job)' : '⏭️ skipped / failed'} |

### Review feedback
- Confirm gauges, CoPilot, and routing still work on the preview.
- If typecheck failed, fix TS errors before requesting review.
- If E2E failed, download the Playwright report artifact.

---
*Grok Automated CI/CD • ${{ github.workflow }}*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  deploy:
    name: Deploy to production
    needs: [build-and-test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-test.outputs.tests_passed == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: kcss-dist-${{ github.sha }}
          path: dist

      - name: Firebase Hosting (live)
        id: firebase
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .

      - name: deploy_to_production()
        id: hook
        run: python3 scripts/deploy_to_production.py

      - name: Notify maintainers
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const firebaseOk = '${{ steps.firebase.outcome }}' === 'success';
            const hookOk = '${{ steps.hook.outcome }}' === 'success';
            const ok = firebaseOk && hookOk;
            const body = `## Production deploy

**Commit:** \`${{ github.sha }}\`
**Firebase:** ${firebaseOk ? 'success' : 'failed / skipped (check secrets)'}
**deploy_to_production():** ${hookOk ? 'success' : 'failed'}

${ok ? 'Live channel updated.' : 'Deploy did not fully succeed. Rollback job will run if this job failed.'}
`;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                body,
              });
            } catch (e) {
              core.warning('Could not comment on issue #1: ' + e.message);
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Optional Slack webhook
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data '{"text":"KCSS production deploy ${{ job.status }} @ ${{ github.sha }}"}' \
            "$SLACK_WEBHOOK_URL" || true

  rollback:
    name: rollback_deployment() on failure
    needs: deploy
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run rollback_deployment()
        run: python3 scripts/rollback_deployment.py || true

      - name: Remediation comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Deploy failed — rollback attempted

**Commit:** \`${{ github.sha }}\`

### Remediation
1. Inspect the failed deploy job logs.
2. Confirm Firebase secrets: \`FIREBASE_SERVICE_ACCOUNT\`, \`FIREBASE_PROJECT_ID\`.
3. Commit a \`package-lock.json\` so \`npm ci\` is deterministic.
4. Re-run the workflow after fixing the root cause.
5. If live is dirty, complete rollback via \`scripts/rollback_deployment.py\` / \`rollback.sh\` or Firebase channel clone.
`;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                body,
              });
            } catch (e) {
              core.warning(e.message);
            }
