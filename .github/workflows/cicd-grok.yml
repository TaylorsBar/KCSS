name: Grok Automated CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: grok-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

env:
  NODE_VERSION: "20"

jobs:
  build-and-test:
    name: Checkout, test, static analysis
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.gate.outputs.tests_passed }}
      summary: ${{ steps.gate.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static analysis (TypeScript)
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log

      - name: Static analysis (ESLint, optional)
        id: lint
        continue-on-error: true
        run: |
          if npx --no-install eslint --version >/dev/null 2>&1; then
            npx eslint . --ext .ts,.tsx --max-warnings 0 2>&1 | tee lint.log
          else
            echo "ESLint is not installed; TypeScript is the static gate." | tee lint.log
          fi

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log

      - name: Install Playwright
        if: steps.build.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Run tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npx playwright test --reporter=list,junit 2>&1 | tee test.log
        env:
          CI: "true"

      - name: Summarize results
        id: gate
        if: always()
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os

          def tail(name, n=40):
              p = Path(name)
              if not p.exists():
                  return "(no log)"
              lines = p.read_text(errors="replace").splitlines()
              return "\n".join(lines[-n:]) or "(empty)"

          type_ok = os.environ.get("TYPE_OUTCOME") == "success"
          build_ok = os.environ.get("BUILD_OUTCOME") == "success"
          test_outcome = os.environ.get("TEST_OUTCOME")
          test_ok = test_outcome == "success"
          passed = type_ok and build_ok and test_ok

          highlights = []
          if not type_ok:
              highlights.append("TypeScript failed")
          if not build_ok:
              highlights.append("Vite build failed")
          if not test_ok:
              highlights.append("Playwright failed or was skipped")

          status = "PASS" if passed else "FAIL"
          summary = f"KCSS CI {status}. Highlights: {', '.join(highlights) or 'none'}."
          Path("ci-summary.md").write_text(
              "\n".join([
                  f"## Grok CI summary — {status}",
                  "",
                  f"- Commit: `{os.environ.get('SHA','')}`",
                  f"- Branch: `{os.environ.get('REF','')}`",
                  f"- Event: {os.environ.get('EVENT','')}",
                  f"- Typecheck: {os.environ.get('TYPE_OUTCOME')}",
                  f"- Build: {os.environ.get('BUILD_OUTCOME')}",
                  f"- Playwright: {test_outcome or 'skipped'}",
                  "",
                  "### Error highlights",
                  "```",
                  tail("typecheck.log") if not type_ok else "typecheck clean",
                  tail("build.log") if not build_ok else "",
                  tail("test.log") if not test_ok else "tests clean",
                  "```",
                  "",
                  "### Review feedback",
                  "- Confirm gauge and CoPilot flows still render after this diff.",
                  "- Do not merge if typecheck or Playwright is red.",
                  "",
              ])
          )
          Path(os.environ["GITHUB_OUTPUT"]).open("a").write(
              f"tests_passed={'true' if passed else 'false'}\n"
              f"summary={summary}\n"
          )
          print(summary)
          PY
        env:
          TYPE_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}

      - name: Publish job summary
        if: always()
        run: cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.sha }}
          path: |
            ci-summary.md
            typecheck.log
            lint.log
            build.log
            test.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the job if gates are red
        if: steps.gate.outputs.tests_passed != 'true'
        run: exit 1

  pr-comment:
    name: Post PR summary
    needs: build-and-test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.build-and-test.outputs.tests_passed }}' === 'true';
            const author = context.payload.pull_request.user.login;
            const body = [
              `## Grok CI/CD — ${passed ? 'tests passed' : 'tests failed'}`,
              '',
              `@${author} actionable review:`,
              passed
                ? '- Gates are green. Review UX on gauges, CoPilot, and mobile layout before merge.'
                : '- Do not merge. Open the failed job log, fix the highlighted typecheck/build/Playwright errors, and re-run.',
              '',
              `- Commit: \