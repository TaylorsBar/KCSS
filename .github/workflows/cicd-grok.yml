name: Grok Automated CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write
  id-token: write

env:
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: Checkout • Install • Typecheck • Build • E2E
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.gate.outputs.tests_passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            echo "::warning::No package-lock.json found. Falling back to npm install. Commit a lockfile."
            npm install --no-audit --no-fund
          fi

      - name: TypeScript type-check
        id: typecheck
        run: npx tsc --noEmit

      - name: Static analysis (ESLint, soft)
        id: lint
        run: |
          if [ -f eslint.config.js ] || [ -f eslint.config.mjs ] || [ -f .eslintrc.js ] || [ -f .eslintrc.json ] || [ -f .eslintrc.cjs ]; then
            npx eslint . --ext .ts,.tsx --max-warnings 50 || echo "Lint warnings present"
          else
            echo "No ESLint config — skipping. Add eslint if you want static analysis in CI."
          fi

      - name: Production build
        id: build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcss-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        id: e2e
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      - name: Gate output
        id: gate
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.e2e.outcome }}" = "success" ]; then
            echo "tests_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize results
        if: always()
        run: |
          {
            echo "## Grok CI summary — TaylorsBar/KCSS"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| E2E | ${{ steps.e2e.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: PR comment with review notes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const passed = '${{ steps.build.outcome }}' === 'success' && '${{ steps.e2e.outcome }}' === 'success';
            const body = [
              '## Grok CI/CD review',
              '',
              `Hey @${author} — pipeline ran on \`${{ github.sha }}\`.`,
              '',
              '| Check | Result |',
              '|-------|--------|',
              `| TypeScript | ${{ steps.typecheck.outcome }} |`,
              `| ESLint | ${{ steps.lint.outcome }} |`,
              `| Vite build | ${{ steps.build.outcome }} |`,
              `| Playwright E2E | ${{ steps.e2e.outcome }} |`,
              '',
              passed
                ? '**Tests passed.** Preview deploy can proceed if Firebase secrets are set.'
                : '**Tests failed.** Do not merge until typecheck/build/E2E are green.',
              '',
              '### Actionable review',
              '- Commit a `package-lock.json` so `npm ci` is reproducible.',
              '- Canonical source is `src/` — keep root duplicates out.',
              '- Hit CoPilot, gauges, and Appearance persistence on preview before merge.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  deploy:
    name: Production deploy (main only)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-test.outputs.tests_passed == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: kcss-dist-${{ github.sha }}
          path: dist

      - name: Deploy to Firebase live
        id: firebase
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .

      - name: deploy_to_production() hook
        id: hook
        continue-on-error: true
        run: python3 scripts/deploy_to_production.py

      - name: Notify maintainers
        uses: actions/github-script@v7
        with:
          script: |
            const firebaseOk = '${{ steps.firebase.outcome }}' === 'success';
            const hookOk = '${{ steps.hook.outcome }}' === 'success';
            const ok = firebaseOk || hookOk;
            const body = [
              '## Production deploy — CartelWorx KCSS',
              '',
              `**Commit:** \`${{ github.sha }}\``,
              `**Firebase hosting:** ${firebaseOk ? 'success' : 'failed / skipped'}`,
              `**deploy_to_production():** ${hookOk ? 'success' : 'failed / skipped'}`,
              '',
              ok
                ? 'Live channel updated (or hook reported success).'
                : 'Deploy failed. See remediation in the following comment path and run `python3 scripts/rollback_deployment.py`.',
            ].join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                body,
              });
            } catch (e) {
              core.warning('Could not comment on issue/PR #1: ' + e.message);
            }

      - name: Fail job if deploy did not succeed
        if: steps.firebase.outcome != 'success' && steps.hook.outcome != 'success'
        run: |
          echo "Both Firebase deploy and deploy_to_production() failed."
          echo "Remediation:"
          echo "1. Confirm FIREBASE_SERVICE_ACCOUNT and FIREBASE_PROJECT_ID secrets."
          echo "2. Confirm GitHub Environment 'production' approvals."
          echo "3. Rollback: python3 scripts/rollback_deployment.py"
          echo "4. Or firebase hosting:clone SOURCE_SITE:SOURCE_CHANNEL TARGET_SITE:live"
          exit 1

  rollback:
    name: Suggest rollback on deploy failure
    needs: deploy
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: rollback_deployment()
        run: python3 scripts/rollback_deployment.py || true
