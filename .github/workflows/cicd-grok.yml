name: Grok Automated CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: grok-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

env:
  NODE_VERSION: "20"

jobs:
  build-and-test:
    name: Checkout, test, static analysis
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.gate.outputs.tests_passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static analysis (TypeScript)
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log

      - name: Static analysis (ESLint, optional)
        id: lint
        continue-on-error: true
        run: |
          if npx --no-install eslint --version >/dev/null 2>&1; then
            npx eslint . --ext .ts,.tsx --max-warnings 0 2>&1 | tee lint.log
          else
            echo "ESLint is not installed; TypeScript is the static gate." | tee lint.log
          fi

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log

      - name: Install Playwright
        if: steps.build.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Run tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npx playwright test --reporter=list,junit 2>&1 | tee test.log
        env:
          CI: "true"

      - name: Summarize results
        id: gate
        if: always()
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os
          def tail(name, n=40):
              p = Path(name)
              if not p.exists():
                  return "(no log)"
              lines = p.read_text(errors="replace").splitlines()
              return "\n".join(lines[-n:]) or "(empty)"
          type_ok = os.environ.get("TYPE_OUTCOME") == "success"
          build_ok = os.environ.get("BUILD_OUTCOME") == "success"
          test_ok = os.environ.get("TEST_OUTCOME") == "success"
          passed = type_ok and build_ok and test_ok
          status = "PASS" if passed else "FAIL"
          body = [
              f"## Grok CI summary — {status}",
              "",
              f"- Commit: `{os.environ.get('SHA','')}`",
              f"- Branch: `{os.environ.get('REF','')}`",
              f"- Event: {os.environ.get('EVENT','')}",
              f"- Typecheck: {os.environ.get('TYPE_OUTCOME')}",
              f"- Lint: {os.environ.get('LINT_OUTCOME')}",
              f"- Build: {os.environ.get('BUILD_OUTCOME')}",
              f"- Playwright: {os.environ.get('TEST_OUTCOME') or 'skipped'}",
              "",
              "### Error highlights",
              "```",
              tail("typecheck.log") if not type_ok else "typecheck clean",
              tail("build.log") if not build_ok else "",
              tail("test.log") if not test_ok else "tests clean",
              "```",
              "",
              "All tests passed." if passed else "Tests did not pass. Do not deploy.",
          ]
          Path("ci-summary.md").write_text("\n".join(body) + "\n")
          Path("results.xml").touch()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as fh:
              fh.write(f"tests_passed={'true' if passed else 'false'}\n")
          print(status)
          PY
        env:
          TYPE_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}

      - name: Grok code review and summary
        if: always()
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          PROMPT="Analyze the results of this test suite and static analysis for the latest commit. Summarize errors, suggest code improvements, and note if all tests passed. If this is a PR, the workflow will post this as a comment. If this is a main push and tests passed, deployment runs next."
          if [ -z "${GROK_API_KEY:-}" ]; then
            echo "GROK_API_KEY is not set. Local summary is the review." | tee grok-review.md
            exit 0
          fi
          if gh models run --help >/dev/null 2>&1; then
            gh models run grok-4 --input "$PROMPT" --files ci-summary.md typecheck.log build.log test.log > grok-review.md || {
              echo "gh models run failed; keeping local summary." | tee grok-review.md
            }
          else
            echo "gh models is unavailable on this runner. Local summary is the review." | tee grok-review.md
          fi

      - name: Publish job summary
        if: always()
        run: |
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat grok-review.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.sha }}
          path: |
            ci-summary.md
            grok-review.md
            typecheck.log
            lint.log
            build.log
            test.log
            results.xml
            dist/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the job if gates are red
        if: steps.gate.outputs.tests_passed != 'true'
        run: exit 1

  pr-comment:
    name: Post PR summary
    needs: build-and-test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download summary
        uses: actions/download-artifact@v4
        with:
          name: ci-logs-${{ github.sha }}
          path: logs
        continue-on-error: true

      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const passed = '${{ needs.build-and-test.result }}' === 'success';
            const author = context.payload.pull_request.user.login;
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch (e) { return ''; } };
            const detail = read('logs/ci-summary.md') || 'Summary artifact unavailable.';
            const review = read('logs/grok-review.md');
            const body = [
              `## Grok CI/CD — ${passed ? 'tests passed' : 'tests failed'}`,
              '',
              `@${author} actionable review:`,
              passed
                ? '- Gates are green (typecheck, Vite build, Playwright). Check dashboards, CoPilot alerts, and mobile layout before merge.'
                : '- Do not merge. Fix the highlighted typecheck, build, or Playwright errors, then push again.',
              '- Stack is React 19 + Vite + Firebase Hosting. Do not add a Python pytest gate.',
              '',
              detail.slice(0, 4500),
              '',
              review ? review.slice(0, 1500) : ''
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  deploy:
    name: Deploy to production
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: npm ci --no-audit --no-fund && npm run build

      - name: Deploy to Production
        id: deploy
        run: python3 scripts/deploy_to_production.py

      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Notify maintainers
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.deploy.outcome }}' === 'success';
            const body = [
              `## Production deploy ${ok ? 'succeeded' : 'failed'}`,
              '',
              `- Commit: \`${context.sha}\``,
              '- Hook: deploy_to_production()',
              '- Pages: https://taylorsbar.github.io/KCSS/',
              ok
                ? '- @TaylorsBar production is live.'
                : '- @TaylorsBar deploy hook failed. Rollback job will call rollback_deployment().'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.repository.open_issues_count ? 1 : 1,
              body
            }).catch(async () => {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Production deploy notification',
                body
              });
            });

      - name: Slack webhook
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"KCSS deploy ${{ steps.deploy.outcome }} for ${{ github.sha }} https://taylorsbar.github.io/KCSS/\"}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL not set; skipped Slack notify."
          fi

  rollback:
    name: Rollback on deploy failure
    needs: deploy
    if: needs.deploy.result == 'failure' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rollback deployment
        id: rollback
        run: python3 scripts/rollback_deployment.py

      - name: Post remediation
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Deployment failed — rollback attempted',
              '',
              '@TaylorsBar remediation:',
              '1. Read deploy_log.txt and the Actions log for the failing step.',
              '2. Confirm GitHub Pages can publish from the gh-pages branch and the production environment is not waiting on reviewers.',
              '3. If automatic rollback did not restore live, redeploy the last green commit.',
              '4. rollback_deployment() runs ./rollback.sh when present; otherwise it records a manual Firebase clone command.',
              '5. Clear the GitHub Actions billing lock before expecting any job to start.',
              '',
              `Rollback step outcome: ${{ steps.rollback.outcome }}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
