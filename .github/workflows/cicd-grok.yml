name: Grok Automated CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write
  id-token: write

env:
  NODE_VERSION: "20"

jobs:
  build-and-test:
    name: Build, typecheck, E2E
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.e2e.outcome == 'success' && steps.build.outcome == 'success' }}
      typecheck: ${{ steps.typecheck.outcome }}
      build: ${{ steps.build.outcome }}
      e2e: ${{ steps.e2e.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Static analysis (TypeScript)
        id: typecheck
        run: npx tsc --noEmit --pretty false

      - name: Production build
        id: build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run tests
        id: e2e
        run: npx playwright test --reporter=list,junit
        env:
          CI: true

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            results.xml
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarize test results
        if: always()
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Event: ${{ github.event_name }}"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| TypeScript | ${{ steps.typecheck.outcome }} |"
            echo "| Vite build | ${{ steps.build.outcome }} |"
            echo "| Playwright | ${{ steps.e2e.outcome }} |"
            echo ""
            if [ -f results.xml ]; then
              echo "### Error highlights"
              python3 - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("results.xml").getroot()
          except Exception as exc:
              print(f"Could not parse results.xml: {exc}")
              raise SystemExit(0)
          failures = []
          for case in root.iter("testcase"):
              fail = case.find("failure")
              err = case.find("error")
              node = fail if fail is not None else err
              if node is None:
                  continue
              name = case.get("name", "?")
              classname = case.get("classname", "")
              message = (node.get("message") or node.text or "").strip().splitlines()
              first = message[0][:240] if message else "failed"
              failures.append(f"- `{classname}::{name}` — {first}")
          print("\n".join(failures[:12]) if failures else "No failing test cases in results.xml.")
          PY
            else
              echo "No results.xml produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  pr-comment:
    name: PR summary comment
    needs: build-and-test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post summary on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.build-and-test.result }}' === 'success';
            const author = context.payload.pull_request.user.login;
            const body = [
              '## CI summary',
              '',
              `**Result:** ${passed ? 'passed' : 'failed'}`,
              `**Commit:** \`${context.sha}\``,
              '',
              '| Stage | Result |',
              '| --- | --- |',
              `| TypeScript | ${{ needs.build-and-test.outputs.typecheck }} |`,
              `| Vite build | ${{ needs.build-and-test.outputs.build }} |`,
              `| Playwright | ${{ needs.build-and-test.outputs.e2e }} |`,
              '',
              `@${author} actionable review:`,
              passed
                ? '- Confirm dashboard, diagnostics, and tuning routes still match the change.'
                : '- Open the failed job log. Fix the first TypeScript or Playwright error before re-requesting review.',
              '- Do not import from legacy root `components/` or `pages/`. New code stays under `src/`.',
              '- Keep README claims aligned with what this PR actually ships.',
              '',
              'Job logs: ' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  deploy:
    name: Deploy to production
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build
        run: npm run build

      - name: Deploy to Production
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .

      - name: deploy_to_production()
        run: python3 scripts/deploy_to_production.py

      - name: Notify maintainers
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          outcome = os.environ.get("DEPLOY_OUTCOME", "unknown")
          text = f"KCSS production deploy {outcome} for {os.environ.get('GITHUB_SHA','')} on main."
          url = os.environ.get("SLACK_WEBHOOK_URL", "")
          if url:
              req = urllib.request.Request(url, data=json.dumps({"text": text}).encode(), headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=15).read()
              print("Slack notified")
          else:
              print("SLACK_WEBHOOK_URL not set; skipped Slack")
          print(text)
          PY
          gh issue comment 1 --body "## Production deploy ${{ steps.deploy.outcome }}

          Commit \`${{ github.sha }}\`.
          Firebase channel: live.
          Hook log: see deploy job artifacts / deploy_log.txt.
          " || echo "Issue #1 comment skipped"

  rollback:
    name: Rollback on deploy failure
    needs: deploy
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: rollback_deployment()
        run: python3 scripts/rollback_deployment.py || true

      - name: Post remediation
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MSG=$(cat <<EOF
          ## Production deploy failed — remediation

          Commit \`${{ github.sha }}\` did not stay live.

          1. Read the deploy job log and \`deploy_log.txt\`.
          2. Confirm \`FIREBASE_SERVICE_ACCOUNT\` and \`FIREBASE_PROJECT_ID\` secrets.
          3. \`rollback_deployment()\` ran \`scripts/rollback_deployment.py\`. Without \`rollback.sh\`, revert manually:
             \`firebase hosting:clone <site>:<last-good-channel> <site>:live\`
          4. Re-run the workflow only after the failing check is fixed. Do not force-push over a red main.
          EOF
          )
          echo "$MSG"
          gh issue comment 1 --body "$MSG" || echo "Issue #1 comment skipped"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"KCSS production deploy failed for ${{ github.sha }}. Rollback hook ran. See issue #1.\"}" "$SLACK_WEBHOOK_URL" || true
          fi
